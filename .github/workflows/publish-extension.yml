name: Publish Extension Assets

on:
  push:
    branches:
      - main
    paths:
      - "releases/**"
      - "dist/extension/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/publish-extension.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release artifacts exist
        run: |
          test -f releases/pulse-v1.0.0.crx
          test -f releases/updates.xml

      - name: Publish extension release assets
        uses: ncipollo/release-action@v1
        with:
          tag: extension-latest
          name: Pulse Hesias extension latest
          commit: ${{ github.sha }}
          artifacts: releases/pulse-v1.0.0.crx,releases/updates.xml
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          draft: false
          prerelease: false
          body: |
            Automatic publish from the main branch.

            Download the CRX asset from this release, or use the hosted updates.xml for browser auto-update.
